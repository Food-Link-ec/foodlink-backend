spring:
  datasource:
    url: jdbc:h2:mem:foodlink_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  task:
    scheduling:
      enabled: false

foodlink:
  reserva:
    timeout-minutos: 30
  scheduler:
    reservas-delay-ms: 999999999
    lotes-delay-ms: 999999999
