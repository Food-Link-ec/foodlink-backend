name: FoodLink Backend CI

on:
  push:
    branches: [ "dev", "main", "qa" ]
  pull_request:
    branches: [ "dev", "main", "qa" ]

jobs:
  test-and-verify:
    name: Compilar y Ejecutar Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: ⚙️ Ejecutar tests de arquitectura hexagonal
        run: mvn clean test